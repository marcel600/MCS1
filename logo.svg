<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320">
  <defs>
    <linearGradient id="mtnMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9e8d2;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#6db882;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7a50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="snowCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0ead8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9e8d2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Back mountains -->
  <polygon points="95,185 175,75 240,185" fill="#1e4d2c" opacity="0.6"/>
  <polygon points="280,185 360,82 428,185" fill="#1e4d2c" opacity="0.6"/>
  <!-- Front flanking hills -->
  <polygon points="72,185 148,122 218,185" fill="#2d6640" opacity="0.75"/>
  <polygon points="302,185 372,115 448,185" fill="#2d6640" opacity="0.75"/>
  <!-- Main center peak -->
  <polygon points="150,185 260,34 370,185" fill="url(#mtnMain)"/>
  <!-- Snow cap -->
  <polygon points="224,100 260,34 296,100 276,90 260,50 244,90" fill="url(#snowCap)" opacity="0.95"/>
  <!-- Shadow left face -->
  <polygon points="150,185 260,34 222,100 210,130 185,160" fill="#0e2d1a" opacity="0.28"/>

  <!-- Divider lines -->
  <line x1="68" y1="222" x2="192" y2="222" stroke="#4a8c5c" stroke-width="0.8" opacity="0.5"/>
  <line x1="328" y1="222" x2="452" y2="222" stroke="#4a8c5c" stroke-width="0.8" opacity="0.5"/>

  <!-- MCS -->
  <text x="260" y="274"
    font-family="'Trebuchet MS','Arial Narrow',Arial,sans-serif"
    font-size="74" font-weight="700"
    fill="#f0ead8"
    text-anchor="middle"
    letter-spacing="16">MCS</text>

  <!-- MARKETING AGENCY -->
  <text x="260" y="296"
    font-family="'Trebuchet MS',Arial,sans-serif"
    font-size="11" font-weight="400"
    fill="#6db882"
    text-anchor="middle"
    letter-spacing="6">MARKETING AGENCY</text>

  <!-- ESTD 2026 -->
  <text x="260" y="315"
    font-family="'Trebuchet MS',Arial,sans-serif"
    font-size="8.5" font-weight="400"
    fill="#4a8c5c"
    text-anchor="middle"
    letter-spacing="5">ESTD 2026</text>
</svg>
